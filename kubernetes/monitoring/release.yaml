apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-cloud
  namespace: monitoring
spec:
  interval: 1h
  releaseName: grafana-cloud
  targetNamespace: monitoring
  chart:
    spec:
      chart: k8s-monitoring
      version: 4.3.2
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: grafana-cloud-fleet
      valuesKey: password
      targetPath: collectorCommon.alloy.remoteConfig.auth.password
  values:
    cluster:
      name: potber-production
    collectorCommon:
      alloy:
        remoteConfig:
          enabled: true
          url: https://fleet-management-prod-011.grafana.net
          auth:
            username: "1761035"
        alloy:
          extraEnv:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          extraArgs:
            - --cluster.advertise-address=$(POD_IP):12345
    collectors:
      alloy-daemon:
        alloy:
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
        presets:
          - small
          - root
          - host-storage
          - host-network
          - host-cgroup
          - clustered
          - service-discovery
          - filesystem-log-reader
          - daemonset
    telemetryServices:
      node-exporter:
        deploy: true
      kube-state-metrics:
        deploy: true
      beyla:
        deploy: true
        k8sCache:
          replicas: 1
