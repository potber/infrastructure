apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vertical-pod-autoscaler
  namespace: vpa
spec:
  interval: 1h
  releaseName: vertical-pod-autoscaler
  targetNamespace: vpa
  chart:
    spec:
      chart: vertical-pod-autoscaler
      version: 0.10.0
      sourceRef:
        kind: HelmRepository
        name: autoscaler
        namespace: vpa
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    admissionController:
      enabled: false
    updater:
      enabled: false
    recommender:
      enabled: true
      replicas: 1
      leaderElection:
        enabled: false
      podDisruptionBudget:
        enabled: false
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 512Mi
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
