apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vpa-recommendations
  namespace: flux-system
spec:
  dependsOn:
    - name: vpa-system
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  path: ./kubernetes/vpa/recommendations
  sourceRef:
    kind: GitRepository
    name: flux-system
