apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: potber-test
resources:
  - ../../base
configMapGenerator:
  - name: potber-api-config
    envs:
      - potber-api.env
  - name: potber-auth-config
    envs:
      - potber-auth.env
  - name: potber-client-config
    files:
      - injected-config.js=potber-client-config.js
secretGenerator:
  - name: potber-api-secret
    envs:
      - potber-api.secret.env
images:
  - name: ghcr.io/potber/potber-api
    newTag: main-20260711-060121-c217441cf0b50a24d67ef05e6cae04f58102f0b8 # {"$imagepolicy": "flux-system:potber-api-test:tag"}
  - name: ghcr.io/potber/potber-auth
    newTag: main-20260711-060048-8c9d03f59b27a24276cccf6c9e6a92568c2bfd73 # {"$imagepolicy": "flux-system:potber-auth-test:tag"}
  - name: ghcr.io/potber/potber-client
    newTag: main-20260711-060010-71ab758234479244cb12455c9212e87e51e2c171 # {"$imagepolicy": "flux-system:potber-client-test:tag"}
replicas:
  - name: potber-api
    count: 1
  - name: potber-auth
    count: 1
  - name: potber-client
    count: 1
patches:
  - path: patch-potber-api-ingress.yaml
  - path: patch-potber-auth-ingress.yaml
  - path: patch-potber-client-ingress.yaml
