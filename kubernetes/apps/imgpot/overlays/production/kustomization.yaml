apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: potber-prod
resources:
  - ../../base
  - pod-disruption-budget.yaml
configMapGenerator:
  - name: imgpot-config
    envs:
      - imgpot.env
secretGenerator:
  - name: imgpot-secret
    envs:
      - imgpot.secret.env
images:
  - name: ghcr.io/potber/imgpot
    newTag: 1.1.1 # {"$imagepolicy": "flux-system:imgpot-prod:tag"}
replicas:
  - name: imgpot
    count: 2
patches:
  - path: patch-imgpot-ingress.yaml
